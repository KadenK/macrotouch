name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false' # packages are unsigned for now

jobs:
  bump:
    name: Bump version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.push.outputs.sha }}
      version: ${{ steps.push.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Bump, commit and push
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version=$(npm version "${{ inputs.bump }}" --no-git-tag-version | sed 's/^v//')
          git commit -am "Release v${version}"
          git push
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  linux-windows:
    name: Linux + Windows packages
    needs: bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # rpm: needed for the .rpm target; wine: needed to build the Windows NSIS installer on Linux
      - name: Install packaging tools
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y rpm wine wine32 wine64

      - run: npm ci

      - run: npm run build

      - name: Package (AppImage, deb, rpm, NSIS)
        run: npx electron-builder --linux --win --x64 --publish never
        env:
          NODE_ENV: production

      - uses: actions/upload-artifact@v4
        with:
          name: packages-linux-windows
          if-no-files-found: error
          path: |
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.rpm
            dist-electron/*.exe

  macos:
    name: macOS packages
    needs: bump
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Package (dmg, x64 + arm64)
        run: npx electron-builder --mac --x64 --arm64 --publish never
        env:
          NODE_ENV: production

      - uses: actions/upload-artifact@v4
        with:
          name: packages-macos
          if-no-files-found: error
          path: dist-electron/*.dmg

  release:
    name: Draft release
    needs: [bump, linux-windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: packages
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.bump.outputs.version }}
        run: |
          gh release create "v${VERSION}" packages/* \
            --draft --title "v${VERSION}" --generate-notes \
            --target "${{ needs.bump.outputs.sha }}"
