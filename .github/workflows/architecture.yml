name: Architecture Diagrams

on:
  push:
    branches: [master]
    paths:
      - 'docs/architecture/**'
      - '.github/workflows/architecture.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npx likec4 validate docs/architecture

      - run: npx likec4 build docs/architecture -o _site/docs/diagrams --base /${{ github.event.repository.name }}/docs/diagrams/ --use-hash-history

      # Placeholder root until there is a real site
      - run: echo '<meta http-equiv="refresh" content="0; url=docs/diagrams/">' > _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
